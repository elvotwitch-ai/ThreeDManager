name: aeu-threedmanager

x-app-environment: &app-environment
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_HTTP_PORTS: "8080"
  ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB:?Defina POSTGRES_DB};Username=${POSTGRES_USER:?Defina POSTGRES_USER};Password=${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}"
  AlphaAccess__Username: "${AlphaAccess__Username:?Defina AlphaAccess__Username}"
  AlphaAccess__Password: "${AlphaAccess__Password:?Defina AlphaAccess__Password}"

services:
  db:
    image: postgres:16
    env_file: .env.aeu
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build:
      context: .
      target: web
    env_file: .env.aeu
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8800:8080"
    volumes:
      - keys:/usr/share/ThreeDManager/keys

  # Uso explícito antes da primeira subida e após integrar novas migrações.
  migrate:
    profiles: ["migrate"]
    build:
      context: .
      target: migrate
    env_file: .env.aeu
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
    name: aeu_threedmanager_pgdata
  keys:
    name: aeu_threedmanager_keys
